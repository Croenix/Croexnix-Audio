name: croenix_app
description: Croenix ESP32 High-Fidelity Audio Player Mobile Companion

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  glassmorphism: ^3.0.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  animations: ^2.0.11

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Network & Communication
  web_socket_channel: ^2.4.0
  http: ^1.1.2
  connectivity_plus: ^6.1.0
  network_info_plus: ^6.1.0

  # Device Discovery
  multicast_dns: ^0.3.2+4

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Visualization
  flutter_audio_waveforms: ^1.2.0
  audio_waveforms: ^1.0.5

  # Utilities
  intl: ^0.18.1
  path: ^1.8.3
  equatable: ^2.0.5
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  # Fonts (Uncomment after adding TTF files to assets/fonts/)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
